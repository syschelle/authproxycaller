services:
  authproxycaller:
    image: ${AUTHPROXYCALLER_IMAGE:-ghcr.io/syschelle/authproxycaller:latest}
    container_name: authproxycaller
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
